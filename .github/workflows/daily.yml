name: Daily Push

# 每天北京时间 07:00 触发（UTC 23:00，前一天）
on:
  workflow_dispatch:     # 触发改由 weather-push 仓库的定时跨仓库唤醒（其 schedule 在 GitHub 上可靠）
  push:
    tags:
      - 'test-trigger'   # 临时：本地手动触发测试用，测后移除

# 允许 workflow push 归档 HTML
permissions:
  contents: write

concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史才能 push
          fetch-depth: 0
          # 使用 GITHUB_TOKEN 以便后续 push
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install websocket-client

      - name: Set Beijing Time
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "TZ=Asia/Shanghai" >> $GITHUB_ENV

      - name: Generate HTML
        env:
          MODE: html
        run: python daily_push.py

      - name: Commit archives to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "无新内容，跳过 commit"
          else
            git commit -m "chore(daily): $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Wait for GitHub Pages deploy
        run: |
          echo "等待 Pages 部署生效..."
          sleep 90

      - name: Push to WeChat Work (智能机器人优先，自建应用兜底)
        env:
          MODE: push
          # 智能机器人（优先）：主动推送仅支持 markdown + template_card
          BOT_ID: ${{ secrets.BOT_ID }}
          BOT_SECRET: ${{ secrets.BOT_SECRET }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHAT_TYPE: "1"
          # 自建应用兜底（text + image，个人微信兼容）
          CORPID: ${{ secrets.CORPID }}
          CORPSECRET: ${{ secrets.CORPSECRET }}
          AGENTID: ${{ secrets.AGENTID }}
          TOUSER: ${{ secrets.TOUSER }}
          # 群机器人 Webhook（企微群聊推送；硬编码因当前无法用 API 写入 Secrets）
          WEBHOOK_URL: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=9a1bae5b-8b85-4f7a-b8f4-6f7ffc8d12f6"
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # 早安 / 天气 / 恋爱小情书（合并自 4everyL/daily，原微信公众号测试号推送）
          HEFENG_KEY: ${{ secrets.HEFENG_KEY }}
          CITY: ${{ secrets.CITY }}
          TIAN_KEY: ${{ secrets.TIAN_KEY }}
          START_DATE: ${{ secrets.START_DATE }}
          JINGJING_BIRTHDAY: ${{ secrets.JINGJING_BIRTHDAY }}
          PIPI_TEXT: ${{ secrets.PIPI_TEXT }}
          LUCKY_TEXT: ${{ secrets.LUCKY_TEXT }}
          LIZHI_TEXT: ${{ secrets.LIZHI_TEXT }}
          TIANQI_TEXT: ${{ secrets.TIANQI_TEXT }}
        run: python daily_push.py
